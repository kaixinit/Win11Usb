name: Windows build and regression
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build one EXE
        run: .\build\Build-Win11Usb.ps1
      - name: Run non-destructive regression suites
        run: .\tests\Run-Tests.ps1
      - name: Package candidate
        run: .\build\Package-Release.ps1
      - name: Upload candidate and test record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Win11Usb-candidate
          path: |
            release/*.zip
            release/SHA256SUMS.txt
            tests/artifacts/test-results.json
          if-no-files-found: error
          retention-days: 14
